services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/flight_monitor.db
      # 具体 CORS / PUBLIC_MODE 以 .env 为准；勿用 *（会破坏 guest Cookie）
    volumes:
      - fm_data:/app/data
    restart: unless-stopped
    mem_limit: 1800m

volumes:
  fm_data:
